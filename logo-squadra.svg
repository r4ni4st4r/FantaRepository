<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480" role="img" aria-labelledby="t d">
  <title id="t">raniastar team — stemma</title>
  <desc id="d">Testa di lupo stilizzata color panna su campo bordeaux, bordo e cartiglio verdi, nei colori della maglia.</desc>

  <defs>
